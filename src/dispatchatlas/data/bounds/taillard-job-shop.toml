# Reference values for the makespan of Taillard's job shops ta01 to ta50, as two published sources
# print them: peng2015tabu is Peng, Lü and Cheng (2015) and goncalves2014extended is Gonçalves and
# Resende (2014). The instances ta51 to ta80 are not included.
#
# Each instance table holds the reference upper bound (upper), the reference lower bound (lower)
# and whether the two are equal (optimal), then one inline table per source, named by its
# bibliography key, with the values that source prints:
#
#   upper        the best known upper bound it lists
#   lower        the best known lower bound it lists
#   found_upper  an upper bound it reports as newly found, printed in bold, if any
#   where        the table and page that print the values
#
# The reference upper bound is the smallest upper bound any source prints, listed or newly found.
# The reference lower bound is the largest lower bound any source prints. The loader,
# dispatchatlas.benchmarks.bounds, checks both rules, the optimal flag, and that every instance
# has at least two sources.

# 15 jobs x 15 machines

