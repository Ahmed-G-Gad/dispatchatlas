version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # pyproject.toml caps these two extras; raising a cap waits for the exact-solver tests.
    ignore:
      - dependency-name: pulp
        versions: [">=4"]
      - dependency-name: highspy
        versions: [">=1.14"]
