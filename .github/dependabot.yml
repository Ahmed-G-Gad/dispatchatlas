version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # pyproject.toml caps these two extras; raising a cap waits for the exact-solver tests.
    ignore:
      - dependency-name: pulp
        versions: [">=4"]
      - dependency-name: highspy
        versions: [">=1.14"]
      # No CI job installs the gurobi extra, and Gurobi 14 refuses a licence issued for
      # version 13; taking it waits for a run of the Gurobi backend's tests under a
      # version 14 licence.
      - dependency-name: gurobipy
        versions: [">=14"]
