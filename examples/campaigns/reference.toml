# A campaign file that uses every key of the format, each one explained.
# Check it without running anything:
#
#   dispatchatlas campaign validate examples/campaigns/reference.toml --check-compatibility
#
# The reader is strict: an unknown key, a value of the wrong type (true is not
# a number, "false" is not a boolean), or a missing required key is an error
# that names the entry, for example instances[1].seeds[0].

# ---------------------------------------------------------------- identity
schema_version = 1        # required: the file format version this release reads
id = "reference"          # required: results go to <output>/reference/; letters,
                          # digits, '.', '_', '-'; not part of the config hash
seed = 20240601           # required: root of every run seed
replicates = 10           # runs per stochastic solver, problem, and protocol
                          # (default 30); deterministic solvers run once
objectives = ["makespan"]  # optional: replaces the objectives every problem
                          # declares, primary first, here those of the smoke
                          # catalog's continuum problems, which declare three

# ---------------------------------------------------------------- instances
# One or more sources. Every problem id must be unique across them. Relative
# paths are relative to this file, and are left out of the config hash:
# a problem read from a file is identified by the digest of its content.

[[instances]]             # problems generated by a registered benchmark family
family = "job-shop"
parameters = { jobs = 6, machines = 4 }  # the other parameters keep their defaults
seeds = [1, 2]            # one problem per generator seed

[[instances]]             # instances of a published suite
suite = "taillard-open-shop"
instances = ["tai4x4-1", "tai4x4-2"]
# directory = "downloads" # file suites (OR-Library, Brandimarte, PSPLIB) read the
                          # files you downloaded from the suite's source here;
                          # generated suites (Taillard's) need none

[[instances]]             # every instance of a built-in catalog
catalog = "smoke"
seed = 0                  # root seed of the catalog's instance seeds (default 0)

[[instances]]             # problems written by `dispatchatlas catalogs build`
directory = "instances"   # or by materialize(); each file is checked against
                          # the SHA-256 digest in the directory's manifest.json

[[instances]]             # one instance file
file = "problem.json"     # a problem document, or a file in a published format
# format = "orlib-job-shop"  # when the extension does not imply the format:
                          # orlib-job-shop, orlib-flow-shop, fjs, or psplib

# ---------------------------------------------------------------- solvers
# Registered solver ids with parameter values. Two settings of one solver need
# labels, which then name them in results and tables.

[[solvers]]
id = "neh"

[[solvers]]
id = "simulated-annealing"   # every parameter at its default

[[solvers]]
id = "simulated-annealing"
label = "simulated-annealing-slow-cooling"
parameters = { cooling = 0.99 }

[[solvers]]
id = "tabu-search"
parameters = { tenure = 10, candidates = 30 }

[[solvers]]
id = "min-min"            # does not model permutation problems, so the plan
                          # excludes it from the smoke catalog's flow shops and
                          # records why

[[solvers]]
id = "random-search"      # the baseline every search should beat

# ---------------------------------------------------------------- protocols
# Named stop criteria. Every solver runs under every protocol with the same
# criteria, so each protocol is one fair comparison. Each needs a time,
# evaluation, or iteration limit; the first criterion met ends a run.

[[protocols]]
name = "evaluations-5000"
stop = { max_evaluations = 5000 }   # equal numbers of evaluated schedules

[[protocols]]
name = "time-1s"
stop = { time_limit = 1.0, patience = 500 }
                          # equal wall-clock seconds, and a stop after 500
                          # iterations without improvement; also available:
                          # max_iterations, and target (stop once the primary
                          # objective reaches this value)

# ---------------------------------------------------------------- execution
# How to run. None of these settings changes a result, and none enters the
# config hash, so they may change between sessions of one campaign.

[execution]
backend = "process"       # "process": supervised worker processes, with hard
                          # time limits; "sequential": in the calling process
workers = "auto"          # worker processes, or "auto" for the processors
                          # minus one; must be 1 for the sequential backend
timeout_factor = 1.5      # kill a run after timeout_factor * time_limit + grace
                          # seconds; at least 1 (default 1.0)
grace = 5.0               # seconds added to the hard limit (default 5.0)
retries = 1               # further attempts after a failure that may be
                          # transient (default 0)
record_schedules = true   # store each run's best schedule in its record; its
                          # digest is stored either way (default true)
affinity = "inherit"      # "inherit": the workers run on every processor the
                          # process may use; "pin": worker k runs on the k-th
                          # of them; or a list of processor indices, one per
                          # worker, such as [2, 4, 6] (default "inherit")
threads_per_worker = 1    # threads the numerical libraries of a worker may
                          # use (default 1)

# ---------------------------------------------------------------- metadata
# Free annotations, kept with the results; not part of the config hash.

[metadata]
purpose = "shows every key of the campaign format"
